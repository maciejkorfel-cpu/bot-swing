name: Bot swing - sygnaly

# Główny zegar: cron-job.org co 5 min wywołuje workflow_dispatch z cicho=true
# (cron GitHuba bywa uruchamiany tylko co kilka godzin). Harmonogram poniżej
# zostaje jako zapas, gdyby cron-job.org nie działał.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:               # ręczne uruchomienie z zakładki Actions albo z cron-job.org
    inputs:
      cicho:
        description: "Bez wiadomości testowej na Telegram (dla cron-job.org)"
        type: boolean
        default: false

permissions:
  contents: write                  # zapis state.json (żeby nie dublować sygnałów)

concurrency:
  group: swing-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # zawsze najnowszy state.json, nawet gdy przebieg czekał w kolejce

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skanowanie rynku
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          MAX_POSITIONS: '0'              # 0 = bez limitu pozycji
          BTC_FILTER: '0'                 # 1 = filtr trendu BTC (EMA300 4H)
          CAPITAL: ${{ vars.CAPITAL || '99400' }}
          RISK_PCT: ${{ vars.RISK_PCT || '0.5' }}
          LEVERAGE: ${{ vars.LEVERAGE || '3' }}
          QUIET: ${{ inputs.cicho && '1' || '' }}
        run: python swing_bot.py

      - name: Zapis stanu
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%F_%H:%M)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 3
            done
          fi
